<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Profile Card Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <form>
            <input class="forminps pp" type="text" placeholder="Profile Pic Url">
            <input class="forminps name" type="text" placeholder="Your Name">
            <input class="forminps age" type="text" placeholder="Your Age">
            <input class="forminps occpn" type="text" placeholder="Occupation">
            <input class="forminps abt" type="text" placeholder="About Yourself">
            <button class="forminps sub" type="submit">Submit</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
